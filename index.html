<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Cranes Course - Petrojet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div style="text-align: center; margin-bottom: 16px;">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/3/31/Petrojet-logo.png" alt="Petrojet Logo" style="max-width: 120px;">
                </div>
                <div class="dept-badge">
                    <span class="lang-en">EQUIPMENT DEPARTMENT</span>
                    <span class="lang-ar">إدارة المعدات</span>
                </div>
                <h1>
                    <span class="lang-en">MOBILE CRANES COURSE</span>
                    <span class="lang-ar">دورة الرافعات المتحركة</span>
                </h1>
                <div class="instructor-info">
                    <p class="instructor-name">
                        <span class="lang-en">Engineer / Ahmed Eissa</span>
                        <span class="lang-ar">المهندس / أحمد عيسى</span>
                    </p>
                    <p class="training-type">
                        <span class="lang-en">TECHNICAL MAINTENANCE TRAINING</span>
                        <span class="lang-ar">تدريب الصيانة الفنية</span>
                    </p>
                </div>
            </div>
            
            <nav class="toc" id="toc">
                <!-- TOC sections will be injected here by JS -->
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-left">
                    <button id="menu-toggle" class="icon-btn" aria-label="Toggle Menu">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                    </button>
                    <h2 id="current-slide-title">Loading...</h2>
                </div>
                <div class="topbar-right">
                    <button id="lang-toggle" class="lang-btn">عربي</button>
                    <button id="theme-toggle" class="icon-btn theme-toggle" aria-label="Toggle Dark Mode">
                        <svg class="sun-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                        <svg class="moon-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </button>
                </div>
            </header>

            <!-- Slides Container -->
            <div class="slides-wrapper" id="slides-wrapper">
                <!-- Slides will be injected here by JS -->
            </div>

            <!-- Bottom Navigation -->
            <footer class="slide-nav">
                <button id="btn-prev" class="nav-btn" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                    <span class="lang-en">Previous</span>
                    <span class="lang-ar">السابق</span>
                </button>
                <div class="slide-counter">
                    <span class="lang-en">Slide <span id="current-index-en">0</span> of <span id="total-slides-en">0</span></span>
                    <span class="lang-ar">شريحة <span id="current-index-ar">0</span> من <span id="total-slides-ar">0</span></span>
                </div>
                <button id="btn-next" class="nav-btn">
                    <span class="lang-en">Next</span>
                    <span class="lang-ar">التالي</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </footer>
        </main>
    </div>

    <!-- Load data first, then logic -->
    <script src="content/lecture-5.js"></script>
    <script src="content/lecture-6.js"></script>
    <script src="content/course-index.js"></script>
    <script src="script.js"></script>
</body>
</html>
